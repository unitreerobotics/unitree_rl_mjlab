robot: "r1"
robot_scene: "src/assets/robots/unitree_r1/xmls/scene_arena.xml"
#robot_scene: "src/assets/robots/unitree_r1/xmls/scene_kuka.xml"  # KUKA cell only
#robot: "g1_23dof"
#robot_scene: "src/assets/robots/unitree_g1/xmls/scene_g1_23dof.xml"
#robot: "h1_2"
#robot_scene: "src/assets/robots/unitree_h1_2/xmls/scene_h1_2.xml"
#robot: "go2"
#robot_scene: "src/assets/robots/unitree_go2/xmls/scene_go2.xml"
#robot: "a2"
#robot_scene: "src/assets/robots/unitree_a2/xmls/scene_a2.xml"

domain_id: 0  # Domain id
interface: "lo" # Interface

use_joystick: 0 # Simulate Unitree WirelessController using a gamepad
joystick_type: "xbox" # support "xbox" and "switch" gamepad layout
#joystick_device: "/dev/input/js0" # Device path
joystick_device: "/dev/input/js2"
joystick_bits: 16 # Some game controllers may only have 8-bit accuracy

print_scene_information: 1 # Print link, joint and sensors information of robot

enable_elastic_band: 0 # Virtual spring band, used for lifting h1

# Head camera: rendered as the R1's fisheye (head_camera.json, from arena-r1-kit) and published
# where mediamtx serves the robot's camera; start mediamtx with mediamtx_sim.yml first.
head_camera: 1
head_camera_model: "head_camera.json"
head_camera_fps: 30  # target; the laptop reaches about 27 in stereo. The real camera's rate is not known yet: match it for sim = real
head_camera_url: "rtsp://127.0.0.1:8554/robot"
ffmpeg: "/home/tefai/tools/ffmpeg/ffmpeg"  # needs ffmpeg >= 5.1 (-fps_mode); was /home/mayyar/tools/ffmpeg/ffmpeg

# Depth image of the head's camera module (R1 EDU spec: 544 x 448 at 10 Hz), rendered with the head
# camera (needs head_camera: 1) from the MJCF camera "depth_camera" and written to /dev/shm for the
# perception process. Pinhole: its vertical field is the camera's fovy (124 deg, the spec's), which
# gives 132 deg across; the spec's 150 deg is the colour image's. Layout in src/depth_camera.h.
depth_camera: 1
depth_camera_width: 544
depth_camera_height: 448
depth_camera_fps: 10
depth_camera_shm: "/r1_depth"
